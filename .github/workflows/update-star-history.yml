name: Update star history

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-star-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test the generator
        run: go test ./internal/starhistory ./internal/readme ./cmd/fnctl -count=1

      - name: Generate the chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/fnctl star-history --repo "${{ github.repository }}" --output assets/star-history.svg

      - name: Commit a changed chart
        run: |
          if git diff --quiet -- assets/star-history.svg; then
            echo "Star history is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.svg
          git commit -m "chore: refresh star history"
          git pull --rebase origin main
          git push origin HEAD:main
